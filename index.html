<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7F7F7">
<title>MUTO — Creator Brief</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F172A'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23C8A96A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     Creator Brief — deck renderer (creator-brief skill)
     Slide deck: one section per slide, scroll-snap, alternating light/dark.
     All copy and media references live in content.js — this file only renders it.
     Empty sections hide themselves (heading included) and the numbering closes up.
     Brand colours: content.js -> theme { ink, paper, accent }.
     ===================================================================== */
  :root{
    --ink:#0F172A; --ink-2:#334155; --muted:#64748B;
    --paper:#F7F7F7; --white:#FFFFFF; --line:#E2E8F0;
    --gold:#C8A96A; --gold-soft:#F3EBDB;
    --dark-card:#111C33; --dark-line:#1E293B; --dark-rule:#334155; --dark-muted:#94A3B8; --dark-body:#CBD5E1;
    --radius:20px;
    --pad:clamp(20px,5vw,72px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  @media (max-width:900px),(max-height:820px){html{scroll-snap-type:y proximity}}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}
  body.locked{overflow:hidden}
  img,video{display:block;max-width:100%}
  a{color:inherit}
  ::selection{background:var(--ink);color:var(--paper)}
  .hidden{display:none!important}

  .slide{min-height:100vh;min-height:100svh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;padding:clamp(84px,11vh,112px) var(--pad) clamp(48px,7vh,72px);position:relative;overflow:hidden}
  .slide.dark{background:var(--ink);color:var(--paper)}
  .slide.white{background:var(--white)}
  .wrap{width:100%;max-width:1120px}

  .eyebrow{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
  .dark .eyebrow{color:var(--dark-muted)}
  h1{font-size:clamp(38px,6.2vw,76px);font-weight:800;line-height:1.02;letter-spacing:-.03em}
  h2{font-size:clamp(28px,4vw,52px);font-weight:800;line-height:1.06;letter-spacing:-.025em;margin-bottom:clamp(20px,4vh,40px)}
  .lede{font-size:clamp(17px,2vw,23px);color:var(--ink-2);max-width:640px;margin-top:20px}
  .dark .lede{color:var(--dark-body)}
  .sub{font-size:16px;color:var(--muted);max-width:760px;margin:-8px 0 26px}
  .dark .sub{color:var(--dark-muted)}
  .gold{color:var(--gold)}

  /* top bar */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px var(--pad);pointer-events:none;transition:color .3s}
  .topbar .wm{font-size:20px;font-weight:800;letter-spacing:-.02em;text-transform:uppercase;pointer-events:auto}
  .topbar .btn{pointer-events:auto}
  .btn{display:inline-flex;align-items:center;gap:9px;background:var(--ink);color:var(--paper);border:0;font-family:inherit;text-decoration:none;font-weight:700;font-size:16px;padding:14px 22px;border-radius:999px;cursor:pointer;transition:transform .15s ease,background .2s}
  .btn:hover{transform:translateY(-1px)}
  .btn.small{font-size:14px;padding:10px 16px}
  .btn.gold{background:var(--gold);color:var(--ink)}
  .btn svg{width:15px;height:15px}
  body.on-dark .topbar{color:var(--paper)}
  body.on-dark .topbar .btn{background:var(--paper);color:var(--ink)}

  /* dots */
  .dots{position:fixed;right:clamp(10px,2vw,26px);top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;gap:12px}
  .dots button{width:10px;height:10px;border-radius:50%;border:0;background:#CBD5E1;cursor:pointer;padding:0;transition:transform .2s,background .2s}
  .dots button[aria-current="true"]{background:var(--ink);transform:scale(1.35)}
  body.on-dark .dots button{background:#475569}
  body.on-dark .dots button[aria-current="true"]{background:var(--paper)}
  @media (max-width:900px){.dots{display:none}}

  /* hero */
  .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(24px,4vw,64px);align-items:center}
  .hero-card{background:var(--white);border-radius:28px;padding:26px 28px;box-shadow:0 30px 80px -30px rgba(15,23,42,.35)}
  .hero-card .t{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
  .hero-card ol{list-style:none}
  .hero-card li+li{border-top:1px solid var(--line)}
  .hero-card a{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:baseline;padding:11px 0;text-decoration:none;font-weight:600;font-size:16.5px;letter-spacing:-.01em}
  .hero-card a:hover{color:var(--gold)}
  .hero-card .n{color:var(--gold);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
  .hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}
  .hint span{width:1px;height:26px;background:var(--muted);animation:drip 1.8s infinite}
  @keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
  @media (max-width:900px){.hero-grid{grid-template-columns:1fr}}

  /* numbered cards — vibe / principles / themes / results */
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
  .cards.two{grid-template-columns:repeat(2,1fr)}
  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px 24px;display:grid;grid-template-columns:auto 1fr;column-gap:11px;row-gap:8px;align-content:start}
  /* number sits on the headline's line, not stacked above it */
  .card .n{align-self:center}
  .card h3{align-self:center}
  .card > p,.card > ul{grid-column:1/-1}
  .dark .card{background:var(--dark-card);border-color:var(--dark-line)}
  .card .n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
  .dark .card .n{background:var(--gold);color:var(--ink)}
  .card h3{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
  .card p{color:var(--muted);font-size:15.5px}
  .dark .card p{color:var(--dark-body)}
  .card ul{margin:0 0 8px;padding-left:17px;color:var(--muted);font-size:15.5px}
  .dark .card ul{color:var(--dark-body)}
  .card ul li{margin:3px 0}
  .card.plain .n{display:none}
  /* theme cards: setting / format / hook lines / frames from the ads behind the theme */
  .card .tmeta{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:2px 0 0;font-size:15px}
  .card .tmeta dt{font-weight:700;color:var(--ink)}
  .card .tmeta dd{margin:0;color:var(--muted)}
  .card .tlab{grid-column:1/-1;margin-top:6px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
  .card ul.thooks{list-style:none;padding:0;margin:0}
  .card ul.thooks li{margin:0 0 6px;padding-left:12px;border-left:3px solid var(--gold);color:var(--ink);font-style:italic}
  .card .tframes{grid-column:1/-1;display:flex;gap:8px;overflow-x:auto;margin-top:6px;padding-bottom:4px}
  .card .tframes img{flex:0 0 auto;width:92px;aspect-ratio:9/16;object-fit:cover;border-radius:10px;background:#E2E8F0}
  .dark .card .tmeta dt,.dark .card .tlab,.dark .card ul.thooks li{color:var(--paper)}
  .dark .card .tmeta dd{color:var(--dark-body)}
  @media (max-width:560px){.card .tmeta{grid-template-columns:1fr;row-gap:2px}.card .tmeta dd{margin-bottom:8px}}
  @media (max-width:900px){.cards,.cards.two{grid-template-columns:1fr 1fr}}
  @media (max-width:560px){.cards,.cards.two{grid-template-columns:1fr}}

  /* video / stills rails */
  .rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 64px)/5);gap:16px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin}
  .rail.stills{grid-auto-columns:calc((100% - 64px)/5)}
  .rail-hint{color:var(--muted);font-size:14px;margin-top:10px}
  .dark .rail-hint{color:var(--dark-muted)}
  .vid{position:relative;border-radius:18px;overflow:hidden;background:#1E293B;aspect-ratio:var(--ar,9/16);scroll-snap-align:start}
  .vid video,.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
  .vid .cap{position:absolute;left:0;right:0;bottom:0;padding:38px 13px 13px;background:linear-gradient(transparent,rgba(15,23,42,.9));color:#fff;pointer-events:none}
  .vid .cap b{display:block;font-size:15px;font-weight:700;line-height:1.25}
  .vid .cap span{display:block;font-size:12.5px;color:#CBD5E1;margin-top:2px}
  .vid .sound{position:absolute;top:10px;right:10px;background:rgba(15,23,42,.62);color:#fff;border:0;border-radius:999px;font:600 12px "Plus Jakarta Sans",sans-serif;padding:6px 10px;cursor:pointer}
  .shot{scroll-snap-align:start}
  .shot .ph{border-radius:18px;overflow:hidden;background:#E2E8F0;aspect-ratio:9/16}
  .shot img{width:100%;height:100%;object-fit:cover}
  .shot figcaption{font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.4}
  .dark .shot figcaption{color:var(--dark-muted)}
  /* hook frames sit 6 across (same rhythm as the deck's proof rail) */
  #hookFrames{grid-auto-columns:calc((100% - 80px)/6)}
  @media (max-width:1000px){#hookFrames{grid-auto-columns:calc((100% - 16px)/2.3)}}
  @media (max-width:640px){#hookFrames{grid-auto-columns:62%}}
  .shot figcaption b{display:block;font-weight:700;color:var(--ink)}
  .dark .shot figcaption b{color:var(--paper)}
  .sub.tight{margin:0 0 16px}
  .embeds{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  @media (max-width:1000px){.rail,.rail.stills{grid-auto-columns:calc((100% - 16px)/2.3)}}
  @media (max-width:640px){
    .rail,.rail.stills{grid-auto-columns:72%;margin-right:calc(-1*var(--pad));padding-right:var(--pad);scrollbar-width:none}
    .rail::-webkit-scrollbar{display:none}
  }

  /* best sellers — 10 tiles, store's own ranking */
  .bs-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
  .bs-tabs button{font:inherit;font-size:13.5px;font-weight:700;letter-spacing:-.01em;cursor:pointer;padding:9px 16px;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--white);color:var(--muted);transition:background .15s,color .15s,border-color .15s}
  .dark .bs-tabs button{background:var(--dark-card);border-color:var(--dark-line);color:var(--dark-muted)}
  .bs-tabs button:hover{border-color:var(--gold);color:var(--ink)}
  .dark .bs-tabs button:hover{color:var(--paper)}
  .bs-tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .dark .bs-tabs button[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:var(--ink)}
  .bs-tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  @media (max-width:560px){.bs-tabs{gap:6px}.bs-tabs button{font-size:12.5px;padding:8px 13px}}
  .bs-groups{display:grid;gap:20px}
  .bs-h{margin:0 0 9px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .dark .bs-h{color:var(--dark-muted)}
  .bs{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;align-items:start}
  .bs a{display:block;text-decoration:none;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:12px 12px 14px;transition:transform .15s ease,border-color .2s}
  .dark .bs a{background:var(--dark-card);border-color:var(--dark-line)}
  .bs a:hover{transform:translateY(-2px);border-color:var(--gold)}
  .bs .ph{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--paper);display:grid;place-items:center}
  .dark .bs .ph{background:#0B1426}
  .bs img{width:100%;height:100%;object-fit:contain;padding:6px}
  .bs .n{position:absolute;top:6px;left:6px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:800;line-height:1;padding:5px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
  .bs .pre{display:block;font-size:12px;color:var(--muted);margin-top:10px;line-height:1.3}
  .dark .bs .pre{color:var(--dark-muted)}
  .bs .t{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.3;margin-top:2px;color:var(--ink)}
  .dark .bs .t{color:var(--paper)}
  @media (min-width:901px) and (max-height:980px){.bs-groups{gap:14px}.bs-h{margin-bottom:6px}.bs{gap:12px}.bs a{padding:10px 10px 12px}.bs .pre{margin-top:8px}}
  @media (max-width:1000px){.bs{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:560px){.bs{grid-template-columns:repeat(2,1fr);gap:10px}.bs a{padding:9px 9px 11px;border-radius:14px}.bs .t{font-size:13px}.bs .pre{font-size:11px;margin-top:8px}}

  /* link cards (hooks that are plain links) */
  .links{display:grid;gap:12px;margin-top:14px}
  .linkcard{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;text-decoration:none;border:1px solid var(--line);border-radius:var(--radius);background:var(--white);transition:transform .15s ease,border-color .2s}
  .dark .linkcard{background:var(--dark-card);border-color:var(--dark-line)}
  .linkcard:hover{transform:translateY(-1px);border-color:var(--gold)}
  .linkcard .t{font-weight:700;font-size:15.5px;overflow-wrap:anywhere}
  .linkcard .u{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
  .dark .linkcard .u{color:var(--dark-muted)}
  .linkcard .go{flex:0 0 auto;font-size:18px;font-weight:700;color:var(--gold)}
  .grouptitle{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}
  .dark .grouptitle{color:var(--dark-muted)}
  .group:first-of-type .grouptitle{margin-top:0}

  /* reference ads */
  .refads{margin-top:clamp(20px,4vh,34px)}
  .refads h3{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
  .refads .note{font-size:14.5px;color:var(--muted);margin-bottom:14px;max-width:720px}
  .dark .refads .note{color:var(--dark-muted)}
  .refads ol{list-style:none;counter-reset:ra;display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
  .refads li{counter-increment:ra;border-bottom:1px solid var(--line)}
  .dark .refads li{border-color:var(--dark-rule)}
  .refads a{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:baseline;padding:12px 0;text-decoration:none}
  .refads a:hover .brand{color:var(--gold)}
  .refads .n{color:var(--gold);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .refads .n::before{content:counter(ra,decimal-leading-zero)}
  .refads .brand{font-size:15.5px;font-weight:600;line-height:1.3}
  .refads .hl{display:block;color:var(--muted);font-size:13.5px;font-weight:400;line-height:1.4;margin-top:2px}
  .dark .refads .hl{color:var(--dark-muted)}
  .refads .days{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .dark .refads .days{color:var(--dark-muted)}
  @media (max-width:860px){.refads ol{grid-template-columns:1fr}}
  @media (max-width:520px){.refads a{grid-template-columns:24px 1fr}.refads .days{grid-column:2;margin-top:3px}}

  /* checklist */
  .check{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .list{border:1px solid var(--line);border-radius:var(--radius);background:var(--white);padding:22px 24px 12px}
  .dark .list{background:var(--dark-card);border-color:var(--dark-line)}
  .list h3{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
  .list.ok h3{color:var(--gold)}
  .list.no h3{color:var(--muted)}
  .dark .list.no h3{color:var(--dark-muted)}
  .list ul{list-style:none}
  .list li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:15.5px}
  .dark .list li{border-color:var(--dark-rule)}
  .list li:first-child{border-top:0}
  .list .ic{flex:0 0 18px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;margin-top:3px}
  .list .ic svg{width:15px;height:15px}
  .list.ok .ic{color:var(--gold)}
  .list.no .ic{color:var(--muted)}
  .list.no li{color:var(--muted)}
  .dark .list.no li,.dark .list.no .ic{color:var(--dark-muted)}
  @media (max-width:760px){.check{grid-template-columns:1fr}}

  /* closing */
  .cta{text-align:center}
  .cta .lede{margin:0 auto 32px}
  .cta .fine{color:var(--dark-muted);font-size:14px;margin-top:20px}

  /* country popup */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.72);display:none;align-items:flex-end;justify-content:center;z-index:60;padding:16px}
  @media(min-width:560px){.overlay{align-items:center}}
  .overlay.show{display:flex}
  .dialog{background:var(--white);border-radius:26px;padding:30px 28px 26px;width:100%;max-width:580px;box-shadow:0 40px 90px -30px rgba(15,23,42,.6);animation:pop .22s ease-out;max-height:92vh;overflow-y:auto}
  @keyframes pop{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
  .dialog h2{font-size:clamp(26px,3.4vw,34px);margin-bottom:6px}
  .dialog .sub{margin:0 0 22px;font-size:15.5px}
  .countries{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(min-width:560px){.countries{grid-template-columns:1fr 1fr 1fr}}
  .country{border:1px solid var(--line);border-radius:14px;background:var(--white);padding:13px 14px;font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;transition:border-color .2s,transform .15s ease}
  .country:hover,.country:focus-visible{border-color:var(--gold);transform:translateY(-1px);outline:none}
  .country .f{font-size:19px;line-height:1}

  /* short desktop viewports: keep dense sections inside one screen */
  @media (min-width:901px) and (max-height:980px){
    h2{font-size:clamp(26px,3.3vw,42px);margin-bottom:clamp(14px,2.6vh,26px)}
    .cards,.cards.two,.check{gap:14px}
    .card{padding:16px 18px 18px}
    .card .n{width:30px;height:30px;font-size:13px}
    .card h3{font-size:17.5px}
    .card p,.card ul{font-size:14.5px;line-height:1.4}
    .list{padding:18px 20px 10px}
    .list li{font-size:15px;padding:8px 0}
    .grouptitle{margin:18px 0 10px}
    .sub.tight{margin:0 0 12px}
    .rail{padding-bottom:6px}
    .shot figcaption{margin-top:8px;font-size:13px}
  }

  /* phone */
  @media (max-width:640px){
    .slide{padding:76px var(--pad) 34px}
    .eyebrow{font-size:11px;margin-bottom:10px}
    h1{font-size:34px}
    h2{font-size:26px;margin-bottom:16px}
    .lede{font-size:16px;margin-top:14px}
    .sub{font-size:14.5px;margin:-4px 0 18px}
    .topbar{padding:14px var(--pad)}
    .topbar .wm{font-size:17px}
    .btn.small{font-size:13px;padding:9px 14px;min-height:44px}
    .hero-grid{gap:18px}
    .hero-card{padding:18px 20px;border-radius:20px}
    .hero-card a{font-size:15px;padding:11px 0;min-height:44px;align-items:center}
    .hint{bottom:14px}
    .cards,.cards.two{gap:10px}
    .card{padding:16px 16px 18px;border-radius:16px}
    .card .n{width:28px;height:28px;font-size:13px}
    .card h3{font-size:16.5px}
    .card p,.card ul{font-size:14px;line-height:1.4}
    .list{padding:16px 18px 8px;border-radius:16px}
    .list li{font-size:14px;padding:8px 0}

  var RATIO = { '9:16': '9/16', '16:9': '16/9', '1:1': '1/1', '4:5': '4/5' };
  function resolve(item) {
    var u = item.url || '', m;
    if ((m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/)))
      return { type: 'iframe', src: 'https://www.youtube-nocookie.com/embed/' + m[1] + '?rel=0&playsinline=1', aspect: /shorts\//.test(u) ? '9:16' : '16:9' };
    if ((m = u.match(/tiktok\.com\/.*\/video\/(\d+)/)))
      return { type: 'iframe', src: 'https://www.tiktok.com/embed/v2/' + m[1], aspect: '9:16' };
    if ((m = u.match(/instagram\.com\/(?:reel|reels|p)\/([\w-]+)/)))
      return { type: 'iframe', src: 'https://www.instagram.com/reel/' + m[1] + '/embed/', aspect: '9:16' };

      return { type: 'iframe', src: 'https://player.vimeo.com/video/' + m[1], aspect: '16:9' };
    if ((m = u.match(/loom\.com\/(?:share|embed)\/([a-f0-9]{32})/)))
      return { type: 'iframe', src: 'https://www.loom.com/embed/' + m[1], aspect: '16:9' };
    if ((m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([\w-]+)/)))

      return { type: 'iframe', src: 'https://drive.google.com/file/d/' + m[1] + '/preview', aspect: '9:16' };
    if (/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(u))
      return { type: 'video', src: u, aspect: '9:16' };
    return { type: 'link', src: u };
  }
  /* "Name — Product" -> bold name + small product line */
  function splitTitle(t) {

  function renderVideos(elId, items, T) {

    var rail = [], links = [];
    items.forEach(function (it) { (resolve(it).type === 'link' ? links : rail).push(cardHTML(it, T(it.title))); });
    el.innerHTML = (rail.length ? '<div class="rail">' + rail.join('') + '</div>' : '') +

    var CK = L.checklist || {};
    if (show('s-check', !!(CK.title && ((CK.dos || []).length || (CK.donts || []).length)))) {
      $('checkTitle').textContent = T(CK.title);
      $('doTitle').textContent = T(CK.doTitle);
      $('dontTitle').textContent = T(CK.dontTitle);
      $('dos').innerHTML = (CK.dos || []).map(function (s) { return '<li><span class="ic">' + ICON_OK + '</span><span>' + esc(T(s)) + '</span></li>'; }).join('');
      $('donts').innerHTML = (CK.donts || []).map(function (s) { return '<li><span class="ic">' + ICON_NO + '</span><span>' + esc(T(s)) + '</span></li>'; }).join('');
    }

    /* after you post */
    if (show('s-results', !!(L.results && L.results.title))) {
      var RESB = (B.results && (B.results[code] || B.results.en)) || {};
      $('resTitle').textContent = T(L.results.title);
      $('resIntro').textContent = T(L.results.intro);
      $('resIntro').classList.toggle('hidden', !L.results.intro);
      $('results').className = 'succ-stories';
      $('results').innerHTML = successHTML(RESB.items || [], L.results.banner, T);
    }

    /* closing */
    var FT = L.footer || {};
    $('endTitle').textContent = T(FT.title || hero.tagline);
    $('footNote').textContent = T(FT.note);
    $('footNote').classList.toggle('hidden', !T(FT.note));
    var CTA = FT.cta || {};
    if (show('footCta', !!(CTA.url && T(CTA.label)))) { $('footCta').href = CTA.url; $('footCta').textContent = T(CTA.label); }
    $('footContact').textContent = T(FT.contact);
    show('footContact', !!T(FT.contact));
    $('footLang').textContent = T(FT.switchLang || 'Change language');
    show('footLang', MULTI);
    show('langBtn', MULTI);

    $('app').classList.remove('hidden');

    /* hero index + section numbers come from the sections that are actually visible */
    var sections = [
      ['s-vibe', L.vibe && L.vibe.title], ['s-frames', F.title], ['s-best', SB.title],
      ['s-icp', ICPL.title], ['s-themes', L.themes && L.themes.title], ['s-viral', VCL.title],
      ['s-claims', CL.title],
      ['s-principles', L.principles && L.principles.title], ['s-hooks', H.title],
      ['s-check', CK.title], ['s-results', L.results && L.results.title]
    ].filter(function (s) { return s[1] && !$(s[0]).classList.contains('hidden'); });
    $('indexList').innerHTML = sections.map(function (s, i) {
      return '<li><a href="#' + s[0] + '"><span class="n">' + pad2(i + 1) + '</span><span>' + esc(T(s[1])) + '</span></a></li>';
    }).join('');
    sections.forEach(function (s, i) {
      var eb = $(s[0]).querySelector('.eyebrow'); if (eb) eb.textContent = pad2(i + 1);
    });

    alignEyebrows();
    initDeck();
  }

  /* ---------- optical alignment of the section numbers ----------
     Eyebrow and headline share a left box edge, but each glyph carries its own side
     bearing, which scales with font size. Canvas reports the real ink offset, so the
     eyebrow is nudged by the difference and the number lines up with the headline. */
  function alignEyebrows() {
    var ctx = alignEyebrows._c || (alignEyebrows._c = document.createElement('canvas').getContext('2d'));
    function bearing(el) {
      var t = (el.textContent || '').trim();
      if (!t) return 0;
      var cs = getComputedStyle(el);
      ctx.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
      var m = ctx.measureText(t.charAt(0));
      return m.actualBoundingBoxLeft == null ? 0 : -m.actualBoundingBoxLeft;
    }
    Array.prototype.forEach.call(document.querySelectorAll('.slide'), function (sec) {
      var eb = sec.querySelector('.eyebrow'), hd = sec.querySelector('h1, h2');
      if (!eb || !hd) return;
      eb.style.textIndent = '';
      var d = bearing(hd) - bearing(eb);
      eb.style.textIndent = Math.abs(d) < 0.05 ? '' : d.toFixed(2) + 'px';
    });
  }
  window.addEventListener('resize', alignEyebrows);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignEyebrows);

  /* ---------- deck behaviour: dots, theme, reveal, video autoplay ---------- */
  var slideObs, revObs, vidObs;
  function initDeck() {
    var slides = Array.prototype.slice.call(document.querySelectorAll('.slide')).filter(function (s) { return !s.classList.contains('hidden'); });
    var dots = $('dots');
    dots.innerHTML = '';
    slides.forEach(function (s, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.setAttribute('aria-label', 'Go to section ' + (i + 1));
      b.addEventListener('click', function () { s.scrollIntoView({ behavior: 'smooth' }); });
      dots.appendChild(b);
    });
    var dotBtns = dots.querySelectorAll('button');

    if (slideObs) slideObs.disconnect();
    slideObs = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        var i = slides.indexOf(en.target);
        dotBtns.forEach(function (d, j) { d.setAttribute('aria-current', j === i ? 'true' : 'false'); });
        document.body.classList.toggle('on-dark', en.target.dataset.theme === 'dark');
      });
    }, { threshold: 0.55 });
    slides.forEach(function (s) { slideObs.observe(s); });

    if (revObs) revObs.disconnect();
    revObs = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (!en.isIntersecting) return; en.target.classList.add('in'); revObs.unobserve(en.target); });
    }, { threshold: 0.15 });
    document.querySelectorAll('.reveal').forEach(function (el) {
      el.classList.remove('in');
      el.style.transitionDelay = (Math.min(Array.prototype.indexOf.call(el.parentNode.children, el), 8) * 55) + 'ms';
      revObs.observe(el);
    });

    if (vidObs) vidObs.disconnect();
    vidObs = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        var v = en.target;
        if (en.isIntersecting) { var p = v.play(); if (p && p.catch) p.catch(function () {}); } else { v.pause(); }
      });
    }, { threshold: 0.5 });
    document.querySelectorAll('.vid video').forEach(function (v) { vidObs.observe(v); });

    document.querySelectorAll('.vid .sound').forEach(function (btn) {
      if (btn.dataset.wired) return;
      btn.dataset.wired = '1';
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var video = btn.parentNode.querySelector('video');
        document.querySelectorAll('.vid video').forEach(function (o) {
          if (o !== video) { o.muted = true; var b = o.parentNode.querySelector('.sound'); if (b) b.textContent = UI.soundOn; }
        });
        video.muted = !video.muted;
        btn.textContent = video.muted ? UI.soundOn : UI.soundOff;
        var p = video.play(); if (p && p.catch) p.catch(function () {});
      });
    });

    window.__slides = slides;
  }

  /* keyboard: arrows / page keys jump section by section */
  document.addEventListener('keydown', function (e) {
    var slides = window.__slides || [];
    if (!slides.length || ['ArrowDown', 'PageDown', 'ArrowUp', 'PageUp'].indexOf(e.key) < 0) return;
    if ($('overlay').classList.contains('show')) return;
    var y = window.scrollY;
    var cur = slides.reduce(function (best, s, i) { return Math.abs(s.offsetTop - y) < Math.abs(slides[best].offsetTop - y) ? i : best; }, 0);
    var next = (e.key === 'ArrowDown' || e.key === 'PageDown') ? Math.min(cur + 1, slides.length - 1) : Math.max(cur - 1, 0);
    e.preventDefault(); slides[next].scrollIntoView({ behavior: 'smooth' });
  });

  /* ---------- market picker ---------- */
  var POP = B.popup || {};
  $('popEyebrow').textContent = POP.eyebrow || 'Creator Brief';
  $('popTitle').textContent = POP.title || 'Where are you from?';
  $('popSub').textContent = POP.sub || "Pick your country — we'll show the brief in your language.";
  function openPopup() { $('overlay').classList.add('show'); document.body.classList.add('locked'); }
  function closePopup() { $('overlay').classList.remove('show'); document.body.classList.remove('locked'); }
  function findCountry(id) { if (!id) return null; id = String(id).toUpperCase(); for (var i = 0; i < COUNTRIES.length; i++) if (String(COUNTRIES[i].id).toUpperCase() === id) return COUNTRIES[i]; return null; }
  function firstForLang(code) { for (var i = 0; i < COUNTRIES.length; i++) if (COUNTRIES[i].lang === code) return COUNTRIES[i]; return null; }
  function setCountry(c, fromUser) {
    try { localStorage.setItem(LS, c.id); } catch (e) {}
    render(c); closePopup();
    if (fromUser) {
      var u = new URL(location.href); u.searchParams.delete('lang'); u.searchParams.set('c', c.id);
      try { history.replaceState(null, '', u.toString()); } catch (e) {}
      window.scrollTo(0, 0);
    }
  }
  $('countries').innerHTML = COUNTRIES.map(function (c, i) {
    return '<button class="country" type="button" data-i="' + i + '">' + (c.flag ? '<span class="f">' + c.flag + '</span>' : '') + '<span>' + esc(c.name) + '</span></button>';
  }).join('');
  $('countries').addEventListener('click', function (e) {
    var b = e.target.closest('.country'); if (!b) return;
    setCountry(COUNTRIES[+b.getAttribute('data-i')], true);
  });
  $('langBtn').addEventListener('click', openPopup);
  $('footLang').addEventListener('click', openPopup);

  /* ---------- pop-up (products + avatars share one modal) ---------- */
  var bsModal = $('bsModal'), bsLastFocus = null;
  function closeBsModal() {
    bsModal.hidden = true;
    document.body.classList.remove('bsmodal-open');
    if (bsLastFocus && bsLastFocus.focus) { try { bsLastFocus.focus(); } catch (e) {} }
    bsLastFocus = null;
  }
  function setText(id, val) { var el = $(id); el.textContent = val || ''; el.style.display = val ? '' : 'none'; }
  function fillList(wrapId, titleId, listId, title, items) {
    var w = $(wrapId);
    if (items && items.length) {
      w.hidden = false;
      $(titleId).textContent = title || '';
      $(listId).innerHTML = items.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('');
    } else { w.hidden = true; }
  }
  function fillModal(d, trigger) {
    bsLastFocus = trigger || null;
    $('bsmImg').style.backgroundImage = d.img ? 'url("' + d.img + '")' : 'none';
    $('bsmImg').style.display = d.img ? '' : 'none';
    setText('bsmWhen', d.when);
    $('bsmName').textContent = d.name || '';
    setText('bsmTag', d.tag);
    setText('bsmSum', d.summary);
    fillList('bsmAnglesWrap', 'bsmAnglesTitle', 'bsmAngles', d.list1Title, d.list1);
    fillList('bsmList2Wrap', 'bsmList2Title', 'bsmList2', d.list2Title, d.list2);
    fillList('bsmList3Wrap', 'bsmList3Title', 'bsmList3', d.list3Title, d.list3);
    var iw = $('bsmIngWrap');
    if (d.ingredients && d.ingredients.length) {
      iw.hidden = false;
      $('bsmIngTitle').textContent = d.ingredientsTitle || '';
      $('bsmIng').innerHTML = d.ingredients.map(function (x) {
        return '<li><span class="ing-n">' + esc(x.name) + '</span><span class="ing-d">' + esc(x.dose) + '</span>' +
               (x.line ? '<span class="ing-l">' + esc(x.line) + '</span>' : '') + '</li>';
      }).join('');
    } else { iw.hidden = true; }
    var rw = $('bsmRefWrap');
    if (d.refAds && d.refAds.length) {
      rw.hidden = false;
      $('bsmRefTitle').textContent = d.refTitle || '';
      $('bsmRef').innerHTML = d.refAds.map(function (r) {
        return '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' +
               (r.poster ? '<img src="' + esc(r.poster) + '" alt="' + esc(r.label || '') + '" loading="lazy">' : '') +
               '<span class="play" aria-hidden="true">&#9658;</span>' +
               (r.label ? '<span class="lab">' + esc(r.label) + '</span>' : '') + '</a>';
      }).join('');
    } else { rw.hidden = true; }
    var cta = $('bsmCta');
    if (d.ctaUrl) {
      cta.hidden = false; cta.style.display = ''; cta.href = d.ctaUrl; cta.textContent = d.ctaLabel || 'View on site  ↗';
    } else { cta.hidden = true; cta.style.display = 'none'; }
    bsModal.hidden = false;
    document.body.classList.add('bsmodal-open');
    bsModal.scrollTop = 0; var card = bsModal.querySelector('.bsmodal-card'); if (card) card.scrollTop = 0;
    $('bsmName').setAttribute('tabindex', '-1');
    try { $('bsmName').focus(); } catch (e) {}
  }
  function openProduct(key, trigger) {
    var p = BS_PRODUCTS[key]; if (!p) return;
    fillModal({
      img: p.img, when: p.when, name: p.name, tag: p.tagline, summary: p.summary,
      list1Title: p.anglesTitle, list1: p.angles,
      ingredientsTitle: p.ingredientsTitle, ingredients: p.ingredients,
      ctaUrl: p.url, ctaLabel: p.url ? (BS_STORE ? ('View on ' + BS_STORE + '  ↗') : 'View on site  ↗') : ''
    }, trigger);
  }
  function openAvatar(key, trigger) {
    var a = ICP_AVATARS[key]; if (!a) return;
    fillModal({
      when: a.role, name: a.name, tag: a.tag, summary: a.who,
      list1Title: a.factsTitle, list1: a.facts,
      list2Title: a.problemTitle, list2: a.problem,
      list3Title: a.reachTitle, list3: a.reach,
      refTitle: a.refTitle, refAds: a.refAds
    }, trigger);
  }
  $('bestList').addEventListener('click', function (e) {
    var a = e.target.closest('a.has-modal'); if (!a) return;
    e.preventDefault();
    openProduct(a.getAttribute('data-bs'), a);
  });
  $('icpList').addEventListener('click', function (e) {
    var b = e.target.closest('.icp-card'); if (!b) return;
    openAvatar(b.getAttribute('data-icp'), b);
  });
  bsModal.addEventListener('click', function (e) {
    if (e.target.hasAttribute('data-close')) closeBsModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !bsModal.hidden) closeBsModal();
  });

  /* ---------- boot: one market = straight in; else ?c=SE > ?lang=sv > remembered > picker ---------- */
  var qs = new URLSearchParams(location.search), saved = null;
  try { saved = localStorage.getItem(LS); } catch (e) {}
  var start = !MULTI ? COUNTRIES[0]
    : (findCountry(qs.get('c')) || (qs.get('lang') && firstForLang(qs.get('lang'))) || (saved && findCountry(saved)) || null);
  if (start) setCountry(start, false); else openPopup();
})();
</script>
</body>
</html>
